server {
    listen 80;
    listen [::]:80;
    server_name 100serolife.co.kr www.100serolife.co.kr;
    
    # 기존 사이트 root
    root /var/www/100serolife.co.kr/public;
    index index.php index.html;
    
    # 기존 사이트 기본 처리
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # /atomy 서브디렉토리 -> Laravel
    location ^~ /atomy {
        alias /var/www/atomy/webapp/public;
        try_files $uri $uri/ @atomy;
        
        location ~ \.php$ {
            return 404;
        }
    }
    
    location @atomy {
        rewrite ^/atomy/(.*)$ /atomy/index.php?$1 last;
    }
    
    location ~ ^/atomy/index\.php(/|$) {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/atomy/webapp/public/index.php;
        fastcgi_param SCRIPT_NAME /atomy/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    
    # 기존 사이트 PHP 처리
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
    
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
